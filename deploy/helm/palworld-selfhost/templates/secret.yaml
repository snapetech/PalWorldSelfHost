{{- if not .Values.settings.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "palworld-selfhost.settingsSecret" . }}
  labels:
    {{- include "palworld-selfhost.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.settings.secretKey }}: |
{{ required "settings.inline must contain a complete PalWorldSettings.ini when settings.existingSecret is empty" .Values.settings.inline | indent 4 }}
{{- end }}
