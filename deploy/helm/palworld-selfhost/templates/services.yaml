apiVersion: v1
kind: Service
metadata:
  name: {{ include "palworld-selfhost.fullname" . }}-headless
  labels:
    {{- include "palworld-selfhost.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "palworld-selfhost.selectorLabels" . | nindent 4 }}
  ports:
    - name: game
      port: {{ .Values.server.port }}
      targetPort: game
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "palworld-selfhost.fullname" . }}
  labels:
    {{- include "palworld-selfhost.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if and (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "palworld-selfhost.selectorLabels" . | nindent 4 }}
  ports:
    - name: game
      port: {{ .Values.server.port }}
      targetPort: game
      protocol: UDP
