apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "palworld-selfhost.fullname" . }}
  labels:
    {{- include "palworld-selfhost.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "palworld-selfhost.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "palworld-selfhost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/adapter: {{ .Files.Get "files/entrypoint.sh" | sha256sum }}
        checksum/settings: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "palworld-selfhost.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: palworld
          image: {{ include "palworld-selfhost.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/palworldselfhost/entrypoint.sh"]
          args:
            - {{ printf "-port=%v" .Values.server.port | quote }}
            {{- range .Values.server.args }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: game
              containerPort: {{ .Values.server.port }}
              protocol: UDP
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /tmp/palworldselfhost.pid && kill -0 $(cat /tmp/palworldselfhost.pid)"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /tmp/palworldselfhost.pid && kill -0 $(cat /tmp/palworldselfhost.pid)"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /tmp/palworldselfhost.pid && kill -0 $(cat /tmp/palworldselfhost.pid)"]
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: saved
              mountPath: /pal/Package/Pal/Saved
            - name: adapter
              mountPath: /palworldselfhost/entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: settings
              mountPath: /run/palworldselfhost
              readOnly: true
      volumes:
        - name: adapter
          configMap:
            name: {{ include "palworld-selfhost.fullname" . }}-adapter
            defaultMode: 0555
        - name: settings
          secret:
            secretName: {{ include "palworld-selfhost.settingsSecret" . }}
            items:
              - key: {{ .Values.settings.secretKey }}
                path: PalWorldSettings.ini
        {{- if .Values.persistence.existingClaim }}
        - name: saved
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: saved
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: saved
        labels:
          {{- include "palworld-selfhost.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
